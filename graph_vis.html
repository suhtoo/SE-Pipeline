<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDF Graph Control Panel (JSON‑LD) – Adjustable Fonts, No Shadows, Deduplicated Literals</title>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700">
  <!-- D3 Library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- N3 Library -->
  <script src="https://unpkg.com/n3@1.16.2/browser/n3.min.js"></script>
  <!-- jsonld.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsonld@1.8.1/dist/jsonld.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f5f5f5;
    }
    #sidebar {
      width: 300px;
      background: #fff;
      padding: 20px;
      border-right: 1px solid #ddd;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      overflow-y: auto;
    }
    #sidebar h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
      color: #333;
    }
    #sidebar label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }
    #sidebar input[type="file"],
    #sidebar input[type="range"],
    #sidebar input[type="text"],
    #sidebar button {
      width: 100%;
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 14px;
      padding: 10px;
    }
    #sidebar input[type="file"],
    #sidebar input[type="range"],
    #sidebar input[type="text"] {
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #sidebar button {
      background-color: #2d3033;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    #sidebar button:hover {
      background-color: #2d3033;
    }
    #graph-info {
      margin: 15px 0;
      font-weight: 500;
      font-size: 16px;
      color: #333;
    }
    /* Legend styling */
    #legend {
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 4px;
    }
    .legend-color {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 5px;
      vertical-align: middle;
    }
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #fafafa;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    /* Node styling – shadow removed */
    .node {
      stroke: #fff;
      stroke-width: 1.5px;
      cursor: pointer;
    }
    /* Link styling with arrow markers */
    .link {
      stroke: #999;
      stroke-opacity: 0.5;
      stroke-width: 1px;
      fill: none;
      marker-end: url(#arrow);
    }
    .link-label {
      font-size: 10px;
      fill: #555;
      pointer-events: none;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
    }
    .labels text {
      font-size: 12px;
      pointer-events: none;
      fill: #333;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
    }
    /* Tooltip styling */
    .tooltip {
      position: absolute;
      padding: 5px 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border-radius: 4px;
      pointer-events: none;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Graph Control Panel</h2>
    <p id="graph-info">Nodes: 0 | Edges: 0</p>
    <label for="file-input">Choose JSON‑LD File:</label>
    <input type="file" id="file-input" accept=".jsonld,.json">
    <!-- Search box for filtering nodes -->
    <label for="node-search">Search Node:</label>
    <input type="text" id="node-search" placeholder="Enter node name...">
    <!-- Legend Section -->
    <div id="legend"></div>
    <button id="toggle-link-labels">Toggle Link Labels</button>
    <button id="fit-graph">Fit Graph</button>
    <button id="export-png">Export as PNG</button>
    <button id="export-svg">Export as SVG</button>
    <label for="node-font-size">Node Label Font Size</label>
    <input type="range" id="node-font-size" min="8" max="24" value="10">
    <label for="link-font-size">Link Label Font Size</label>
    <input type="range" id="link-font-size" min="5" max="24" value="5">
  </div>

  <div id="main">
    <svg>
      <!-- SVG Definitions for arrow marker -->
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L0,6 L9,3 z" fill="#999"></path>
        </marker>
      </defs>
    </svg>
  </div>

  <!-- Tooltip element -->
  <div class="tooltip"></div>

  <script>
    let currentContainer, currentSVG, currentZoom;
    let store = new N3.Store();
    let simulation;
    let prefixes = {};

    // Global variable to track the currently selected node (by click)
    let selectedNode = null;

    // Fixed prefix mappings and associated colors
    const fixedPrefixes = {
      "asb": "http://asb-example.org/",
      "brcomp": "https://w3id.org/brcomp#",
      "brot": "https://w3id.org/brot#",
      "bsdd": "https://identifier.buildingsmart.org/uri/buildingsmart/ifc/4.3/class/",
      "dcterms": "http://purl.org/dc/terms/",
      "dcterms1": "http://purl.org/dc/terms",
      "foaf": "http://xmlns.com/foaf/0.1/",
      "inst": "http://ifc-instance.org/instances/",
      "owl": "http://www.w3.org/2002/07/owl#",
      "prop": "https://identifier.buildingsmart.org/uri/buildingsmart/ifc/4.3/class/prop/",
      "rdf": "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
      "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
      "schema1": "http://schema.org/#",
      "vann": "http://purl.org/vocab/vann/",
      "xsd": "http://www.w3.org/2001/XMLSchema#"
    };

    const fixedColors = {
      "asb": "#1f77b4",
      "brcomp": "#9467bd",
      "brot": "#2ca02c",
      "bsdd": "#d62728",
      "dcterms": "#9467bd",
      "dcterms1": "#8c564b",
      "foaf": "#e377c2",
      "inst": "#ff7f0e",
      "owl": "#bcbd22",
      "prop": "#17becf",
      "rdf": "#aec7e8",
      "rdfs": "#ff9896",
      "schema1": "#98df8a",
      "vann": "#c5b0d5",
      "xsd": "#c49c94"
    };

    // Helper functions
    function shorten(uri, prefixes) {
      if (typeof uri !== 'string') return uri;
      for (const p in fixedPrefixes) {
        const ns = fixedPrefixes[p];
        if (uri.startsWith(ns)) {
          return p + ':' + uri.slice(ns.length);
        }
      }
      for (const prefix in prefixes) {
        const ns = prefixes[prefix];
        if (uri.startsWith(ns)) {
          return prefix + ':' + uri.slice(ns.length);
        }
      }
      return uri;
    }

    function getColor(uri) {
      for (const p in fixedPrefixes) {
        const ns = fixedPrefixes[p];
        if (uri.startsWith(ns)) {
          return fixedColors[p];
        }
      }
      return "#ccc";
    }

    function truncate(text, maxLength = 20) {
      return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
    }

    function extractPrefixes(doc) {
      let extracted = {};
      if (!doc["@context"]) return extracted;
      let context = doc["@context"];
      if (Array.isArray(context)) {
        context.forEach(ctx => {
          if (typeof ctx === "object") {
            for (let key in ctx) {
              let value = ctx[key];
              if (typeof value === "string") {
                extracted[key] = value;
              } else if (typeof value === "object" && value["@id"]) {
                extracted[key] = value["@id"];
              }
            }
          }
        });
      } else if (typeof context === "object") {
        for (let key in context) {
          let value = context[key];
          if (typeof value === "string") {
            extracted[key] = value;
          } else if (typeof value === "object" && value["@id"]) {
            extracted[key] = value["@id"];
          }
        }
      }
      return extracted;
    }

    // Function to update the legend in the sidebar.
    function updateLegend() {
      const legendDiv = document.getElementById("legend");
      let html = "<h3>Legend</h3>";
      html += "<div><span class='legend-color' style='background-color: #ff7f0e;'></span> Literal Node</div>";
      for (const key in fixedPrefixes) {
        html += `<div><span class='legend-color' style='background-color: ${fixedColors[key]};'></span> ${key} (Resource)</div>`;
      }
      html += `<div><span class='legend-color' style='background-color: #ccc;'></span> Other Resource</div>`;
      legendDiv.innerHTML = html;
    }

    // Call updateLegend on page load.
    updateLegend();

    // Initialize SVG and container group.
    currentSVG = d3.select("svg");
    currentContainer = currentSVG.append("g");

    document.getElementById("file-input").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const jsonldData = e.target.result;
          parseJSONLD(jsonldData);
        };
        reader.readAsText(file);
      }
    });

    // Search box event listener to filter nodes by query.
    document.getElementById("node-search").addEventListener("input", function() {
      const query = this.value.trim().toLowerCase();
      if (query === "") {
        currentContainer.selectAll(".node").style("display", "block");
        currentContainer.selectAll(".labels text").style("display", "block");
        currentContainer.selectAll(".links line").style("display", "block");
        currentContainer.selectAll(".link-label").style("display", "block");
        return;
      }
      let matched = new Set();
      currentContainer.selectAll(".node").each(function(d) {
        let label = d.label ? d.label.toLowerCase() : shorten(d.id, prefixes).toLowerCase();
        if (label.includes(query)) {
          matched.add(d.id);
        }
      });
      let visibleNodes = new Set(matched);
      currentContainer.selectAll(".links line").each(function(l) {
        if (matched.has(l.source.id) || matched.has(l.target.id)) {
          visibleNodes.add(l.source.id);
          visibleNodes.add(l.target.id);
        }
      });
      currentContainer.selectAll(".node").style("display", d => visibleNodes.has(d.id) ? "block" : "none");
      currentContainer.selectAll(".labels text").style("display", d => visibleNodes.has(d.id) ? "block" : "none");
      currentContainer.selectAll(".links line").style("display", l =>
        (visibleNodes.has(l.source.id) && visibleNodes.has(l.target.id)) ? "block" : "none"
      );
      currentContainer.selectAll(".link-label").style("display", l =>
        (visibleNodes.has(l.source.id) && visibleNodes.has(l.target.id)) ? "block" : "none"
      );
    });

    function parseJSONLD(jsonldData) {
      let doc;
      try {
        doc = JSON.parse(jsonldData);
      } catch (error) {
        console.error("Invalid JSON‑LD file", error);
        return;
      }
      let extractedPrefixes = extractPrefixes(doc);
      jsonld.toRDF(doc, {format: 'application/n-quads'}, function(err, nquads) {
        if (err) {
          console.error("Error converting JSON‑LD to RDF:", err);
          return;
        }
        store = new N3.Store();
        const parser = new N3.Parser({ format: 'N-Quads' });
        const triples = [];
        parser.parse(nquads, (error, triple, pfx) => {
          if (error) {
            console.error("Error parsing N‑Quads:", error);
          } else if (triple) {
            triples.push(triple);
            store.add(triple);
          } else {
            prefixes = Object.assign({}, extractedPrefixes, pfx || {});
            buildGraph(triples, prefixes);
          }
        });
      });
    }

    function buildGraph(triples, prefixes) {
      currentContainer.selectAll("*").remove();
      if (simulation) simulation.stop();

      const nodesMap = new Map();
      const links = [];

      // Process triples into nodes and links.
      triples.forEach(triple => {
        const subjectId = triple.subject.value;
        if (!nodesMap.has(subjectId)) {
          nodesMap.set(subjectId, { 
            id: subjectId, 
            type: "resource", 
            properties: {},
            color: getColor(subjectId)
          });
        }
        const predicateUri = triple.predicate.value;
        if (triple.object.termType === "NamedNode") {
          const objectId = triple.object.value;
          if (!nodesMap.has(objectId)) {
            nodesMap.set(objectId, { 
              id: objectId, 
              type: "resource", 
              properties: {},
              color: getColor(objectId)
            });
          }
          links.push({ 
            source: subjectId, 
            target: objectId, 
            predicate: predicateUri 
          });
        } else if (triple.object.termType === "Literal") {
          const literalKey = "lit:" + triple.object.value;
          if (!nodesMap.has(literalKey)) {
            nodesMap.set(literalKey, { 
              id: literalKey, 
              type: "literal", 
              label: triple.object.value,
              color: "#7f7f7f"  
            });
          }
          links.push({ 
            source: subjectId, 
            target: literalKey, 
            predicate: predicateUri 
          });
        }
      });

      const nodes = Array.from(nodesMap.values());
      document.getElementById("graph-info").innerText = `Nodes: ${nodes.length} | Edges: ${links.length}`;

      simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(150))
        .force("charge", d3.forceManyBody().strength(-150))
        .force("center", d3.forceCenter(currentSVG.node().clientWidth / 2, currentSVG.node().clientHeight / 2))
        .force("x", d3.forceX(currentSVG.node().clientWidth / 2).strength(0.1))
        .force("y", d3.forceY(currentSVG.node().clientHeight / 2).strength(0.1))
        .force("collide", d3.forceCollide(15));

      const link = currentContainer.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("class", "link");

      const linkLabels = currentContainer.append("g")
        .attr("class", "link-labels")
        .selectAll("text")
        .data(links)
        .join("text")
        .attr("class", "link-label")
        .text(d => shorten(d.predicate, prefixes));

      // NEW: Zoom function to focus on a selected node.
      function zoomToNode(node, scale = 2) {
        const svgWidth = currentSVG.node().clientWidth;
        const svgHeight = currentSVG.node().clientHeight;
        const translateX = svgWidth / 2 - node.x * scale;
        const translateY = svgHeight / 2 - node.y * scale;
        currentSVG.transition()
          .duration(750)
          .call(
            currentZoom.transform,
            d3.zoomIdentity.translate(translateX, translateY).scale(scale)
          );
      }

      const node = currentContainer.append("g")
        .attr("class", "nodes")
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("class", d => `node ${d.type}`)
        .attr("r", d => d.type === "literal" ? 6 : 10)
        .attr("fill", d => d.color)
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("click", function(event, d) {
          event.stopPropagation();
          if (selectedNode && selectedNode.id === d.id) {
            // Deselect: show all nodes/links and reset zoom & collision force.
            selectedNode = null;
            currentContainer.selectAll(".node").style("display", "block");
            currentContainer.selectAll(".labels text").style("display", "block");
            currentContainer.selectAll(".links line").style("display", "block");
            currentContainer.selectAll(".link-label").style("display", "block");
            simulation.force("collide", d3.forceCollide(15));
            simulation.alpha(0.5).restart();
            fitGraph();
          } else {
            // Select this node: filter out unrelated nodes/links.
            selectedNode = d;
            let connectedIds = new Set();
            currentContainer.selectAll(".links line").each(function(l) {
              if (l.source.id === d.id || l.target.id === d.id) {
                connectedIds.add(l.source.id);
                connectedIds.add(l.target.id);
              }
            });
            currentContainer.selectAll(".node").style("display", nd => connectedIds.has(nd.id) ? "block" : "none");
            currentContainer.selectAll(".labels text").style("display", nd => connectedIds.has(nd.id) ? "block" : "none");
            currentContainer.selectAll(".links line").style("display", l =>
              (l.source.id === d.id || l.target.id === d.id) ? "block" : "none"
            );
            currentContainer.selectAll(".link-label").style("display", l =>
              (l.source.id === d.id || l.target.id === d.id) ? "block" : "none"
            );
            // Increase collision radius and restart simulation.
            simulation.force("collide", d3.forceCollide(30));
            simulation.alpha(0.5).restart();
            // Zoom into the selected node.
            zoomToNode(d);
          }
        });

      const labels = currentContainer.append("g")
        .attr("class", "labels")
        .selectAll("text")
        .data(nodes)
        .join("text")
        .attr("dy", -15)
        .attr("text-anchor", "middle")
        .text(d => d.type === "literal" && d.label ? truncate(d.label, 20) : (d.label || shorten(d.id, prefixes)));

      const tooltip = d3.select(".tooltip");
      node.on("mouseover", (event, d) => {
          if(d.type === "literal" && d.label && d.label.length > 20) {
            tooltip.transition().duration(200).style("opacity", 0.9);
            tooltip.html(d.label)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          }
        })
        .on("mouseout", () => {
          tooltip.transition().duration(500).style("opacity", 0);
        });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        linkLabels
          .attr("x", d => (d.source.x + d.target.x) / 2)
          .attr("y", d => (d.source.y + d.target.y) / 2)
          .attr("transform", d => {
            const x = (d.source.x + d.target.x) / 2;
            const y = (d.source.y + d.target.y) / 2;
            let angle = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
            if (angle > 90 || angle < -90) { angle += 180; }
            return `rotate(${angle}, ${x}, ${y})`;
          });
        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);
        labels
          .attr("x", d => d.x)
          .attr("y", d => d.y);
      });

      currentZoom = d3.zoom()
        .scaleExtent([0.1, 10])
        .on("zoom", event => { currentContainer.attr("transform", event.transform); });
      currentSVG.call(currentZoom);

      d3.select("#toggle-link-labels").on("click", () => {
        const lbls = currentContainer.selectAll(".link-label");
        const currentDisplay = lbls.style("display");
        lbls.style("display", currentDisplay === "none" ? "block" : "none");
      });

      d3.select("#fit-graph").on("click", fitGraph);
      d3.select("#export-png").on("click", exportPNG);
      d3.select("#export-svg").on("click", exportSVG);

      d3.select("#node-font-size").on("input", function() {
        const size = this.value + "px";
        currentContainer.selectAll(".labels text").style("font-size", size);
      });
      d3.select("#link-font-size").on("input", function() {
        const size = this.value + "px";
        currentContainer.selectAll(".link-label").style("font-size", size);
      });

      currentSVG.on("click", function() {
        selectedNode = null;
        currentContainer.selectAll(".node").style("display", "block");
        currentContainer.selectAll(".labels text").style("display", "block");
        currentContainer.selectAll(".links line").style("display", "block");
        currentContainer.selectAll(".link-label").style("display", "block");
      });

      fitGraph();
    }

    function fitGraph() {
      const bounds = currentContainer.node().getBBox();
      const parent = currentSVG.node();
      const fullWidth = parent.clientWidth;
      const fullHeight = parent.clientHeight;
      const width = bounds.width;
      const height = bounds.height;
      const midX = bounds.x + width / 2;
      const midY = bounds.y + height / 2;
      if (width === 0 || height === 0) return;
      const scale = 0.85 / Math.max(width / fullWidth, height / fullHeight);
      const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];
      currentSVG
        .transition()
        .duration(750)
        .call(
          currentZoom.transform,
          d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
        );
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      // Keep fixed position if this node is selected.
      if (!selectedNode || selectedNode.id !== d.id) {
        d.fx = null;
        d.fy = null;
      }
    }

    function exportPNG() {
      const clone = currentSVG.node().cloneNode(true);
      const styleEl = document.createElement("style");
      styleEl.textContent = document.querySelector("style").textContent;
      clone.insertBefore(styleEl, clone.firstChild);
      const tempSVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const originalWidth = currentSVG.node().width.baseVal.value;
      const originalHeight = currentSVG.node().height.baseVal.value;
      tempSVG.setAttribute("width", originalWidth);
      tempSVG.setAttribute("height", originalHeight);
      tempSVG.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      tempSVG.appendChild(clone);
      const svgData = new XMLSerializer().serializeToString(tempSVG);
      const img = new Image();
      img.onload = () => {
        const scaleFactor = 3;
        const canvas = document.createElement('canvas');
        canvas.width = originalWidth * scaleFactor;
        canvas.height = originalHeight * scaleFactor;
        const ctx = canvas.getContext('2d');
        ctx.scale(scaleFactor, scaleFactor);
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, originalWidth, originalHeight);
        ctx.drawImage(img, 0, 0);
        const link = document.createElement('a');
        link.download = 'graph.png';
        link.href = canvas.toDataURL();
        link.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }

    function exportSVG() {
      const exportSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      exportSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      exportSvg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
      exportSvg.setAttribute("version", "1.1");

      if (!simulation) {
        console.error("Simulation not found.");
        return;
      }
      const nodesData = simulation.nodes();

      const minX = d3.min(nodesData, d => d.x);
      const minY = d3.min(nodesData, d => d.y);
      const maxX = d3.max(nodesData, d => d.x);
      const maxY = d3.max(nodesData, d => d.y);
      const graphWidth = maxX - minX;
      const graphHeight = maxY - minY;
      const graphCenterX = (minX + maxX) / 2;
      const graphCenterY = (minY + maxY) / 2;

      const exportWidth = graphWidth * 2;
      const exportHeight = graphHeight * 2;
      
      exportSvg.setAttribute("width", exportWidth + "px");
      exportSvg.setAttribute("height", exportHeight + "px");
      exportSvg.setAttribute("viewBox", `0 0 ${exportWidth} ${exportHeight}`);

      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      exportSvg.appendChild(defs);
      const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
      marker.setAttribute("id", "arrow");
      marker.setAttribute("viewBox", "0 0 10 10");
      marker.setAttribute("refX", "6");
      marker.setAttribute("refY", "5");
      marker.setAttribute("markerWidth", "6");
      marker.setAttribute("markerHeight", "6");
      marker.setAttribute("orient", "auto");
      const markerPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      markerPath.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      markerPath.setAttribute("fill", "#999");
      marker.appendChild(markerPath);
      defs.appendChild(marker);

      const styleEl = document.createElementNS("http://www.w3.org/2000/svg", "style");
      styleEl.textContent = `
        .node { stroke: #fff !important; stroke-width: 1.5px !important; }
        .link { 
          stroke: #999 !important; 
          stroke-opacity: 0.8 !important; 
          stroke-width: 1px !important; 
          fill: none !important;
        }
        .link-label { font-size: 10px !important; fill: #555 !important; }
        text { font-family: Arial, sans-serif !important; font-size: 10px !important; }
      `;
      exportSvg.appendChild(styleEl);

      const containerClone = currentContainer.node().cloneNode(true);
      containerClone.removeAttribute("transform");

      const offsetX = exportWidth / 2 - graphCenterX;
      const offsetY = exportHeight / 2 - graphCenterY;
      const exportContainer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      exportContainer.setAttribute("transform", `translate(${offsetX}, ${offsetY})`);
      exportContainer.appendChild(containerClone);
      exportSvg.appendChild(exportContainer);

      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(exportSvg);
      const xmlDeclaration = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n';
      const svgSource = xmlDeclaration + source;
      const blob = new Blob([svgSource], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'graph_for_word.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
